# ร้อย3 (แจ้งปัญหา / ข้อเสนอแนะ) — https://message.songnam.xyz
# Cloudflare Tunnel -> http://localhost:8090 -> nginx -> app:3000
name: r3message

services:
  app:
    build: .
    image: r3message-app:latest
    container_name: r3message-app
    env_file: .env
    volumes:
      - ./data:/data              # r3.db + images/  ← สำรองโฟลเดอร์นี้
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: r3message-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
