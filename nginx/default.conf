# message.songnam.xyz  ->  Cloudflare Tunnel -> 127.0.0.1:8090 (this nginx) -> app:3000

# กันสแปม/เดารหัส: จำกัดคำขอ API ต่อ IP จริงของผู้ใช้ (จาก Cloudflare)
limit_req_zone $http_cf_connecting_ip zone=r3_api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # รูปถูกย่อที่ฝั่งเบราว์เซอร์แล้ว (≤1MB → base64 ≈1.4MB)
    client_max_body_size 3m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=r3_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # รูปแนบ: cache ที่ Cloudflare/เบราว์เซอร์ได้ (app ส่ง Cache-Control มาให้)
    location /i/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        access_log off;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
